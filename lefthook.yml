pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: npx oxlint {staged_files}
      glob: "*.{js,ts,svelte}"

    - name: format-check
      run: npx oxfmt --check src/

    - name: typecheck
      run: npm run check

pre-push:
  jobs:
    - name: test
      run: npm run test:unit -- --run
